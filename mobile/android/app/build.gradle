apply plugin: 'com.android.application'

android {
    namespace = "io.github.jonathanwxyz.reader"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.jonathanwxyz.reader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The compact library (data/library_compact.sqlite, built by scripts/compact_library.py),
// bundled with the app where it's been built: the reader keeps it as the library on the
// device from the first launch, offline too (web/local/manager.js asks the app for it at
// /__app/…, which MainActivity serves). Copied in at build time, out of git, with its
// version as the server's /api/compact gives it: the one compact_library.py wrote in its
// header (the same library built anywhere has the same), else, in an older file, the start
// of its SHA-256. Without it, the app builds as before and the library comes from the server.
def compactLibrary = rootProject.file("../../data/library_compact.sqlite")
def libraryAssets = layout.buildDirectory.dir("generated/library-assets").get().asFile
android.sourceSets.main.assets.srcDir(libraryAssets)
def bundleLibrary = tasks.register("bundleLibrary") {
    outputs.dir(libraryAssets)
    outputs.upToDateWhen { false }
    doLast {
        def out = new File(libraryAssets, "library")
        project.delete(out)
        out.mkdirs()
        if (!compactLibrary.exists()) {
            logger.lifecycle("No data/library_compact.sqlite: the app is built without the library")
            return
        }
        byte[] header = new byte[72]
        compactLibrary.withInputStream { input -> input.readNBytes(header, 0, 72) }
        def version = ((header[68..71] + header[60..63]) as byte[]).encodeHex().toString()
        if (version == "0" * 16) {
            def md = java.security.MessageDigest.getInstance("SHA-256")
            compactLibrary.withInputStream { input ->
                byte[] buf = new byte[1 << 20]
                int n
                while ((n = input.read(buf)) > 0) md.update(buf, 0, n)
            }
            version = md.digest().encodeHex().toString().substring(0, 16)
        }
        project.copy { from compactLibrary; into out; rename { "library-compact.sqlite" } }
        new File(out, "library.json").text = groovy.json.JsonOutput.toJson([version: version, size: compactLibrary.length()])
        logger.lifecycle("Bundled the compact library, version ${version}")
    }
}
preBuild.dependsOn(bundleLibrary)

// The reader's fonts (web/fonts/), bundled so that each is there at once, offline too,
// whichever is chosen: MainActivity answers the pages' /fonts/… from them (BundledFonts).
def webFonts = rootProject.file("../../web/fonts")
def fontAssets = layout.buildDirectory.dir("generated/font-assets").get().asFile
android.sourceSets.main.assets.srcDir(fontAssets)
def bundleFonts = tasks.register("bundleFonts", Sync) {
    from(webFonts) { include "*.woff2" }
    into(new File(fontAssets, "fonts"))
}
preBuild.dependsOn(bundleFonts)

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
