<!doctype html>
<html lang="grc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf6e3">
<meta name="description" content="Read Greek texts verse by verse, following a recitation, with a paraphrase, translations, word study and the ancient scholia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Reader</title>
<link rel="stylesheet" href="style.css">
<script>
  // The chosen theme, applied before the page draws (no flash of the other one).
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  // Text and interface sizes (the reader's Aa menu), likewise.
  try {
    for (const [key, prop] of [["textScale", "--text-scale"], ["uiScale", "--ui-scale"]]) {
      const v = parseFloat(localStorage.getItem(key));
      if (v > 0) document.documentElement.style.setProperty(prop, v);
    }
  } catch {}
  // And the font for the Greek (Gentium unless another was chosen).
  {
    let font = "gentium";
    try { const f = localStorage.getItem("font"); if (f === "garamond" || f === "didot") document.documentElement.dataset.font = font = f; } catch {}
    // Fetch its Greek at once, rather than once the stylesheet has been read.
    const file = { gentium: "gentium-book-plus-400", garamond: "eb-garamond-400", didot: "gfs-didot-400" }[font];
    for (const part of ["greek", "greek-ext"]) {
      const link = Object.assign(document.createElement("link"),
        { rel: "preload", as: "font", type: "font/woff2", crossOrigin: "anonymous", href: `fonts/${file}-${part}.woff2` });
      document.head.append(link);
    }
  }
  // Moving between pages (style.css): the bars stay where they are only from one page of
  // the reader to another. To or from the library, which hasn't them, they're part of the
  // page and fade with it, rather than fading on their own over it (a flicker).
  {
    const reader = (url) => !!url && new URL(url).pathname.endsWith("/read.html");
    const unname = () => { for (const id of ["topbar", "player"]) document.getElementById(id)?.style.setProperty("view-transition-name", "none"); };
    addEventListener("pageswap", (e) => { if (e.viewTransition && !reader(e.activation?.entry?.url)) unname(); });
    addEventListener("pagereveal", (e) => {
      if (e.viewTransition && !reader(window.navigation?.activation?.from?.url)) unname();
    });
  }
  // Start fetching the book now, while the scripts load (app.js picks this up).
  {
    const q = new URLSearchParams(location.search), text = q.get("text") || "iliad", book = Number(q.get("book") || 1);
    window.bookRequest = fetch(`/api/text/${encodeURIComponent(text)}/${book}`);
  }
</script>
<script defer src="native.js"></script>
<script defer src="i18n.js"></script>
<script defer src="theme.js"></script>
<script defer src="shared.js"></script>
<script defer src="offline.js"></script>  <!-- (downloads queued in the library go on while reading) -->
<script defer src="app.js"></script>
</head>
<body>
<header id="topbar">
  <div class="topbar-inner">
    <a id="home" href="./" title="Library" aria-label="Library">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 5.5h5a3 3 0 0 1 3 3V20a2.5 2.5 0 0 0-2.5-2.5H4zM20 5.5h-5a3 3 0 0 0-3 3V20a2.5 2.5 0 0 1 2.5-2.5H20z"/></svg>
    </a>
    <div id="title-picker">
      <button id="title-select" aria-haspopup="listbox" aria-expanded="false" aria-controls="title-menu" disabled>
        <span class="eyebrow" id="eyebrow"><span class="long"></span><span class="short"></span></span>
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
      </button>
      <ul id="title-menu" role="listbox" aria-label="Books of the Testament" hidden></ul>
    </div>
    <div id="book-picker" hidden>
      <button id="book-select" aria-haspopup="listbox" aria-expanded="false" aria-controls="book-menu">
        <span id="book-label"><span class="long"></span><span class="short"></span></span>
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
      </button>
      <ul id="book-menu" role="listbox" aria-label="Book" hidden></ul>
    </div>
    <button id="bookmark" title="Bookmark this verse (B)" aria-label="Bookmark this verse" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg>
    </button>
    <span id="download-slot" hidden></span>
    <div id="size-picker">
      <button id="size-button" title="Text, font and theme" aria-label="Text, font and theme" aria-haspopup="dialog" aria-expanded="false" aria-controls="size-menu">Aa</button>
      <div id="size-menu" role="dialog" aria-label="Text, font and theme" hidden>
        <div class="size-row" data-key="textScale" data-prop="--text-scale">
          <span class="size-name">Text</span>
          <button class="size-step" data-step="-1" aria-label="Smaller text">−</button>
          <output class="size-value">100%</output>
          <button class="size-step" data-step="1" aria-label="Larger text">+</button>
        </div>
        <div class="size-row" data-key="uiScale" data-prop="--ui-scale">
          <span class="size-name">Interface</span>
          <button class="size-step" data-step="-1" aria-label="Smaller interface">−</button>
          <output class="size-value">100%</output>
          <button class="size-step" data-step="1" aria-label="Larger interface">+</button>
        </div>
        <div class="font-row" role="group" aria-label="Font">
          <span class="size-name">Font</span>
          <span class="font-choices">
            <button class="font-choice" data-font="gentium" aria-pressed="false">Gentium</button>
            <button class="font-choice" data-font="garamond" aria-pressed="false">Garamond</button>
            <button class="font-choice" data-font="didot" aria-pressed="false">Didot</button>
          </span>
        </div>
        <div class="font-row theme-row" role="group" aria-label="Theme">
          <span class="size-name">Theme</span>
          <span class="font-choices">
            <button class="theme-choice" data-theme="auto" aria-pressed="false" title="Automatic (as the system)" aria-label="Automatic"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M12 4a8 8 0 0 1 0 16z"/></svg></button>
            <button class="theme-choice" data-theme="light" aria-pressed="false" title="Light" aria-label="Light"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></button>
            <button class="theme-choice" data-theme="dark" aria-pressed="false" title="Dark" aria-label="Dark"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
          </span>
        </div>
          <div class="font-row lang-row" role="group" aria-label="Language">
            <span class="size-name">Language</span>
            <span class="font-choices">
              <button class="lang-choice" data-lang="en" aria-pressed="false" lang="en">English</button>
              <button class="lang-choice" data-lang="el" aria-pressed="false" lang="el">Ελληνικά</button>
              <button class="lang-choice" data-lang="grc" aria-pressed="false" lang="grc" title="Ἀρχαία ἑλληνική">Ἀρχαῖα</button>
            </span>
          </div>
      </div>
    </div>
    <button id="to-start" title="Back to the beginning of the book">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 4h14M12 20V9M7 13l5-5 5 5"/></svg>
      <span class="to-start-text">beginning</span>
    </button>
  </div>
</header>
<script>
  // The text's features as last seen (app.js keeps them): the player shows only its own
  // toggles, and the top bar keeps the download button's place, from the first paint. A
  // text not opened before shows its toggles once they're known.
  try {
    const q = new URLSearchParams(location.search), book = Number(q.get("book") || 1);
    const meta = JSON.parse(localStorage.getItem(`meta:${q.get("text") || "iliad"}`));
    if (!meta?.features) throw 0;
    for (const f of ["audio", "paraphrase", "modern", "translation", "scholia", "words"]) {
      document.body.classList.toggle(`no-${f}`, !meta.features.includes(f));
    }
    document.body.classList.toggle("prose-text", meta.form === "prose");
    if (meta.downloads?.[book]) {
      const slot = document.getElementById("download-slot");
      slot.innerHTML = '<button class="download compact" disabled aria-hidden="true"></button>';
      slot.hidden = false;
    }
  } catch { document.body.classList.add("features-unknown"); }
</script>
<main>
  <ol id="verses" aria-live="off"></ol>
  <div class="credits" id="credits"></div>
  <div id="focus-controls" aria-label="Verse controls">
    <button id="fc-prev" title="Previous verse (↑)" aria-label="Previous verse">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 15l6-6 6 6"/></svg>
    </button>
    <button id="fc-play" title="Play / pause (Space)" aria-label="Play">
      <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </button>
    <button id="fc-next" title="Next verse (↓)" aria-label="Next verse">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
</main>

<footer id="player">
  <audio id="audio" preload="metadata"></audio>
  <div class="transport">
    <span class="side">
      <span class="volume">
        <button id="mute" class="tbtn bare" title="Mute / unmute" aria-label="Mute">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/>
            <path class="vol-waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/>
            <path class="vol-x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
          </svg>
        </button>
        <span class="vol-pop"><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></span>
      </span>
      <span class="speed-pill" title="Playback speed"><span id="speed-label" aria-hidden="true">1×</span>
      <select id="speed" aria-label="Playback speed">
        <option value="0.6">0.6×</option><option value="0.75">0.75×</option><option value="0.9">0.9×</option>
        <option value="1" selected>1×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option>
      </select></span>
    </span>
    <span class="playback">
      <button id="prev" class="tbtn" title="Previous verse (← ↑)" aria-label="Previous verse">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 15l6-6 6 6"/></svg>
      </button>
      <button id="play" class="tbtn play" title="Play / pause (Space)" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <button id="next" class="tbtn" title="Next verse (→ ↓)" aria-label="Next verse">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
      </button>
    </span>
    <span class="end-side">
      <button id="end-mode" class="tbtn bare" data-mode="stop">
        <svg class="em-continue" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M4 12h12M11.5 7l5 5-5 5M20 6v12"/></svg>
        <svg class="em-repeat" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17 3l3 3-3 3M4 11V10a4 4 0 0 1 4-4h12M7 21l-3-3 3-3M20 13v1a4 4 0 0 1-4 4H4M11 10.5l1.5-1V15"/></svg>
        <svg class="em-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor"/></svg>
      </button>
      <input id="position" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
             value="—" title="Type a line number and press Enter" aria-label="Line: type a number and press Enter to jump">
    </span>
    <div class="timeline">
      <span id="time-now" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek">
      <span id="time-total" class="time">0:00</span>
    </div>
  </div>
  <div class="controls">
    <label class="toggle" title="Show only the current verse, with the one before and after (F)"><input type="checkbox" id="focused"> focused</label>
    <label class="toggle" title="Pause at the end of the verse the pointer is on; resume when it moves off"><input type="checkbox" id="hold-on-hover" checked> pause on hover</label>
    <label class="toggle"><input type="checkbox" id="show-paraphrase" checked> paraphrase</label>
    <label class="toggle"><input type="checkbox" id="show-modern"> μετάφραση</label>
    <label class="toggle"><input type="checkbox" id="show-translation"> translation</label>
    <label class="toggle" title="Ancient scholia on the current verse (S)"><input type="checkbox" id="show-scholia"> σχόλια</label>
    <label class="toggle"><input type="checkbox" id="follow" checked> follow</label>
  </div>
</footer>

<div id="gloss" role="tooltip" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<aside id="scholia" hidden aria-label="Scholia">
  <header class="sch-head">
    <span class="sch-title">σχόλια</span>
    <span id="scholia-line"></span>
    <button id="scholia-close" aria-label="Hide scholia" title="Hide scholia (S)">×</button>
  </header>
  <div id="scholia-body"></div>
  <p class="sch-credit">Scholia: Dindorf &amp; Maass, <i>Scholia Graeca in Homeri Iliadem</i> (1875–88), via First1KGreek, CC BY-SA 4.0 · Leaf, Seymour, Benner: via Perseus, CC BY-SA 3.0</p>
</aside>

<aside id="card" hidden aria-live="polite">
  <button id="card-close" aria-label="Close">×</button>
  <div id="card-body"></div>
</aside>
</body>
</html>
